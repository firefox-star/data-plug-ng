services:
  - type: web
    name: data-plug-ng
    runtime: node
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/app/db/custom.db
      - key: PORT
        value: 10000
    plan: free
    region: oregon
